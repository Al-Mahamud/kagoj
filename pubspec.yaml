name: kagoj
description: ePaper reader for Prothom Alo and The Daily Star with listen, meaning and translation tools.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  # 6.2.0 beta: 6.1.5's Android plugin fails on current Android Gradle Plugin (proguard-android.txt).
  flutter_inappwebview: ^6.2.0-beta.3
  flutter_tts: ^4.2.0
  just_audio: ^0.9.42
  dio: ^5.7.0
  sqflite: ^2.4.1
  path: ^1.9.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/js/
    - assets/brand/
